d-poster.BMp3S0XB_cvf5x.webp" aria-label="SO-101 机械臂失落动作视频"><source src="/media/expressions/disappointed.mp4" type="video/mp4"></video><figcaption>失落</figcaption></figure><figure class="gallery-album-item"><video controls playsinline preload="metadata" poster="/_astro/arm-expression-hesitant-poster.CHdM97v__Z3tc4M.webp" aria-label="SO-101 机械臂犹豫动作视频"><source src="/media/expressions/hesitant.mp4" type="video/mp4"></video><figcaption>犹豫</figcaption></figure><figure class="gallery-album-item"><video controls playsinline preload="metadata" poster="/_astro/arm-expression-happy-poster.mnkEf6Iy_a01Y9.webp" aria-label="SO-101 机械臂开心动作视频"><source src="/media/expressions/happy.mp4" type="video/mp4"></video><figcaption>开心</figcaption></figure><figure class="gallery-album-item"><video controls playsinline preload="metadata" poster="/_astro/arm-expression-startled-poster.BJcq_jrw_knHWs.webp" aria-label="SO-101 机械臂震惊动作视频"><source src="/media/expressions/startled.mp4" type="video/mp4"></video><figcaption>震惊</figcaption></figure><figure class="gallery-album-item"><video controls playsinline preload="metadata" poster="/_astro/arm-expression-curious-poster.DekeG6kM_19r26C.webp" aria-label="SO-101 机械臂好奇动作视频"><source src="/media/expressions/curious.mp4" type="video/mp4"></video><figcaption>好奇</figcaption></figure><figure class="gallery-album-item"><video controls playsinline preload="metadata" poster="/_astro/arm-expression-playful-poster.ByVBD3ii_1Y9MpJ.webp" aria-label="SO-101 机械臂玩耍动作视频"><source src="/media/expressions/playful.mp4" type="video/mp4"></video><figcaption>玩耍</figcaption></figure><figure class="gallery-album-item"><video controls playsinline preload="metadata" poster="/_astro/arm-expression-angry-poster.CpOg5sG5_2gauJe.webp" aria-label="SO-101 机械臂生气动作视频"><source src="/media/expressions/angry.mp4" type="video/mp4"></video><figcaption>生气</figcaption></figure></div><div class="prose"><p>Bipu 是基于 Jev 的机械小宠物。觉得苹果的 ELEGNT 台灯很可爱，家里刚好有一台 SO-101，我也想试着做个小玩具。</p>
<p>宠物模式通过 Telegram 接收消息，由 Jev 在规则内选择动作与叫声。第一支短片用已有实拍和后期编排呈现它的小世界，真实消息选择另已完成本地预览联调。章鱼片则是一段固定时间线的联动表演。下面保留了八种动作的单独实拍。</p>
